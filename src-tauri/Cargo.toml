[package]
name = "sigvault-desktop"
version = "0.1.0"
description = "SigVault Desktop — Bitcoin multisig wallet manager"
authors = ["SigVault"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sigvault_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-stronghold = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23.1", features = ["rustls-tls-native-roots"] }
tungstenite = "0.23.0"
reqwest = { version = "0.12.5", default-features = false, features = ["rustls-tls", "json"] }
futures-util = "0.3.30"
futures = "0.3.30"
log = "0.4"
machine-uid = "0.5.2"
uuid = { version = "1.10.0", features = ["v4"] }
thiserror = "1.0.63"
oauth2 = "4.4"
axum = { version = "0.7", features = ["tokio"] }
tower = "0.5"
open = "5.0"
async-hwi = { git = "https://github.com/n1rna/async-hwi.git", branch = "master", features = ["trezor", "bitbox"] }
bitcoin = "0.32.8"
async-trait = "0.1.89"
once_cell = "1.21.3"
hex = "0.4"
rand = "0.10.0"

[dev-dependencies]
env_logger = "0.11"
electrum-client = "0.21"
