[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.60"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.6.5", features = [ "window-show", "window-maximize", "window-start-dragging", "window-unminimize", "window-close", "window-minimize", "window-hide", "window-unmaximize"] }
tauri-plugin-oauth = { git = "https://github.com/FabianLars/tauri-plugin-oauth", version = "0.0.0-alpha.0" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.23.1"
tungstenite = "0.23.0"
reqwest = "0.12.5"
futures-util = "0.3.30"
futures = "0.3.30"
futures-sink = "0.3.30"
log = "0.4"
env_logger = "0.10"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
