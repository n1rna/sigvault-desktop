[package]
name = "sigvault-desktop"
version = "0.0.0-dev"
description = "SigVault Desktop — Bitcoin multisig wallet manager"
authors = ["SigVault"]
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/n1rna/sigvault-desktop"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sigvault_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-stronghold = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23.1", features = ["rustls-tls-native-roots"] }
tungstenite = "0.23.0"
reqwest = { version = "0.12.5", default-features = false, features = ["rustls-tls", "json"] }
futures-util = "0.3.30"
futures = "0.3.30"
log = "0.4"
machine-uid = "0.5.2"
uuid = { version = "1.10.0", features = ["v4"] }
thiserror = "1.0.63"
oauth2 = "4.4"
axum = { version = "0.7", features = ["tokio"] }
tower = "0.5"
open = "5.0"
async-hwi = { git = "https://github.com/n1rna/async-hwi.git", branch = "master", features = ["trezor", "bitbox"] }
bitcoin = "0.32.8"
async-trait = "0.1.89"
once_cell = "1.21.3"
hex = "0.4"
rand = "0.10.0"
argon2 = "0.5"
sha2 = "0.10"
chacha20poly1305 = "0.10"
getrandom = "0.2"
base64 = "0.22"
zeroize = "1.8"
# Direct rustls pin so we can install the `ring` CryptoProvider at
# startup. electrum-client 0.23 (via wallet-runtime → bdk_electrum) uses
# rustls 0.23, which panics on the first TLS handshake unless a default
# provider is installed up front. See `lib.rs::run` for the install call.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Standalone-wallet shared crates from walletrs. QBL-211 (policy-core),
# QBL-212 (wallet-runtime), and QBL-213 (server refactor) are merged on
# walletrs `main`. Pin to a tag when one is cut; until then `main` is
# the stable reference.
policy-core = { git = "https://github.com/n1rna/walletrs.git", branch = "main" }
wallet-runtime = { git = "https://github.com/n1rna/walletrs.git", branch = "main" }
# `file_store` feature wires up `WalletPersister for bdk_file_store::Store`,
# which `LocalBdkPersister` delegates to. wallet-runtime doesn't enable it
# (it's persister-agnostic by design), so we opt in here.
bdk_wallet = { version = "1.1.0", features = ["file_store", "bip39", "keys-bip39"] }
bdk_file_store = "0.18.1"

# Force libusb to be statically linked (vendored from source) so the produced
# binary does not depend on Homebrew's libusb on macOS or a system libusb on Linux.
# Pulled in transitively via async-hwi -> rusb -> libusb1-sys.
libusb1-sys = { version = "0.7", features = ["vendored"] }

[dev-dependencies]
env_logger = "0.11"
electrum-client = "0.21"
tempfile = "3"
