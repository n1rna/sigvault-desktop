name: Release Desktop App

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            label: darwin-aarch64
          - platform: macos-15
            rust_target: x86_64-apple-darwin
            label: darwin-x86_64
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            label: windows-x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # ENV_VARS_DESKTOP is a bundled KEY=VALUE secret on the `development`
      # GitHub environment of this repo. It is not maintained by hand — the
      # private `sigvault-secrets` repo owns the values
      # (projects/desktop/development.env) and pushes them here from its
      # sync-secrets workflow. `.ee.desktop` in this repo is the schema only.
      #
      # The Tauri updater signing keys are the only build-time inputs left;
      # everything else the app needs is per-environment and resolved at
      # runtime (`BUILTIN_OAUTH_CLIENTS` in src-tauri/src/env_config/mod.rs).
      - name: Prepare build environment
        uses: n1rna/ee-action/hydrate@v1
        with:
          environment: development
          config_path: .ee.desktop
          env_file: .env
          gh_secret: ${{ secrets.ENV_VARS_DESKTOP }}

      - name: Set version from tag (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          echo "Setting version to $VERSION"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i '' "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
            sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
            sed -i '' "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          else
            sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
            sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          fi
          grep '"version"' src-tauri/tauri.conf.json
          grep '^version' src-tauri/Cargo.toml
          head -5 package.json

      - name: Set version from tag (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ inputs.tag }}".TrimStart("v")
          Write-Host "Setting version to $version"
          (Get-Content src-tauri/tauri.conf.json) -replace '"version": ".*?"', "`"version`": `"$version`"" | Set-Content src-tauri/tauri.conf.json
          (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*?"', "version = `"$version`"" | Set-Content src-tauri/Cargo.toml
          (Get-Content package.json) -replace '"version": ".*?"', "`"version`": `"$version`"" | Set-Content package.json
          Select-String '"version"' src-tauri/tauri.conf.json
          Select-String '^version' src-tauri/Cargo.toml

      - name: Export env vars for build
        shell: bash
        run: |
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" =~ ^# ]] && continue
            value="${value%\"}"
            value="${value#\"}"
            # GitHub only masks ENV_VARS_DESKTOP as one blob, so a single
            # unbundled value could still reach the log verbatim. Register
            # each one before it goes anywhere near a build tool.
            [[ -n "$value" ]] && echo "::add-mask::${value}"
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done < .env

      - name: Verify updater signing key is present
        shell: bash
        run: |
          # tauri.conf.json sets `plugins.updater.pubkey`, so the bundler will
          # try to sign updater artifacts. An *unset* key aborts with a clear
          # message, but an empty one — what `ee hydrate` writes when the sheet
          # is missing the value, since both signing vars are optional in the
          # schema — only fails later as "failed to decode secret key". Fail
          # here, where the cause is obvious.
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty. Check ENV_VARS_DESKTOP on this repo's 'development' environment; sigvault-secrets (projects/desktop/development.env) is the source of truth."
            exit 1
          fi
          echo "Updater signing key present (${#TAURI_SIGNING_PRIVATE_KEY} chars)."

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libudev-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.label }}

      - name: Install frontend dependencies
        run: bun install

      - name: Clean old bundle artifacts
        shell: bash
        run: rm -rf src-tauri/target/${{ matrix.rust_target }}/release/bundle

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.rust_target }}

      - name: Collect artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          BUNDLE=src-tauri/target/${{ matrix.rust_target }}/release/bundle
          echo "=== Bundle contents ==="
          find $BUNDLE -type f | sort
          cp $BUNDLE/deb/*.deb artifacts/ 2>/dev/null || true
          cp $BUNDLE/rpm/*.rpm artifacts/ 2>/dev/null || true
          cp $BUNDLE/appimage/*.AppImage artifacts/ 2>/dev/null || true
          cp $BUNDLE/appimage/*.AppImage.tar.gz artifacts/ 2>/dev/null || true
          cp $BUNDLE/appimage/*.AppImage.tar.gz.sig artifacts/ 2>/dev/null || true
          echo "=== Collected artifacts ==="
          ls -lh artifacts/

      - name: Collect artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          BUNDLE=src-tauri/target/${{ matrix.rust_target }}/release/bundle
          ARCH="${{ matrix.label }}"  # darwin-aarch64 or darwin-x86_64
          echo "=== Bundle contents ==="
          find $BUNDLE -type f | sort
          cp $BUNDLE/dmg/*.dmg artifacts/ 2>/dev/null || true
          # Rename .app.tar.gz to include arch (avoid collision between aarch64/x86_64)
          for f in $BUNDLE/macos/*.app.tar.gz; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .app.tar.gz)
            cp "$f" "artifacts/${base}_${ARCH}.app.tar.gz"
          done
          for f in $BUNDLE/macos/*.app.tar.gz.sig; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .app.tar.gz.sig)
            cp "$f" "artifacts/${base}_${ARCH}.app.tar.gz.sig"
          done
          echo "=== Collected artifacts ==="
          ls -lh artifacts/

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          $bundle = "src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          Write-Host "=== Bundle contents ==="
          Get-ChildItem -Recurse $bundle -File | ForEach-Object { $_.FullName }
          Copy-Item "$bundle/nsis/*.exe" artifacts/ -ErrorAction SilentlyContinue
          Copy-Item "$bundle/nsis/*.nsis.zip" artifacts/ -ErrorAction SilentlyContinue
          Copy-Item "$bundle/nsis/*.nsis.zip.sig" artifacts/ -ErrorAction SilentlyContinue
          Write-Host "=== Collected artifacts ==="
          Get-ChildItem artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR all-artifacts/

      - name: Generate SHA-256 checksums
        run: |
          cd all-artifacts
          sha256sum * > SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Generate updater manifest (latest.json)
        shell: bash
        run: |
          cd all-artifacts
          VERSION="${{ inputs.tag }}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REPO="https://github.com/n1rna/sigvault-desktop/releases/download/${VERSION}"

          # Helper: read signature file content (empty string if missing)
          read_sig() { cat "$1" 2>/dev/null || echo ""; }

          # Helper: find first matching file (empty string if none)
          find_file() { ls $1 2>/dev/null | grep -v '\.sig$' | head -1 || echo ""; }

          LINUX_FILE=$(find_file "*AppImage.tar.gz")
          LINUX_SIG=$(read_sig "${LINUX_FILE}.sig")
          LINUX_URL="${REPO}/${LINUX_FILE}"

          DARWIN_AARCH64_FILE=$(find_file "*darwin-aarch64.app.tar.gz")
          DARWIN_AARCH64_SIG=$(read_sig "${DARWIN_AARCH64_FILE}.sig")
          DARWIN_AARCH64_URL="${REPO}/${DARWIN_AARCH64_FILE}"

          DARWIN_X86_FILE=$(find_file "*darwin-x86_64.app.tar.gz")
          DARWIN_X86_SIG=$(read_sig "${DARWIN_X86_FILE}.sig")
          DARWIN_X86_URL="${REPO}/${DARWIN_X86_FILE}"

          WINDOWS_FILE=$(find_file "*nsis.zip")
          WINDOWS_SIG=$(read_sig "${WINDOWS_FILE}.sig")
          WINDOWS_URL="${REPO}/${WINDOWS_FILE}"

          echo "=== Updater artifacts found ==="
          echo "Linux:          ${LINUX_FILE:-MISSING}"
          echo "macOS ARM:      ${DARWIN_AARCH64_FILE:-MISSING}"
          echo "macOS Intel:    ${DARWIN_X86_FILE:-MISSING}"
          echo "Windows:        ${WINDOWS_FILE:-MISSING}"

          cat > latest.json << MANIFEST
          {
            "version": "${VERSION}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "linux-x86_64": {
                "url": "${LINUX_URL}",
                "signature": "${LINUX_SIG}"
              },
              "darwin-aarch64": {
                "url": "${DARWIN_AARCH64_URL}",
                "signature": "${DARWIN_AARCH64_SIG}"
              },
              "darwin-x86_64": {
                "url": "${DARWIN_X86_URL}",
                "signature": "${DARWIN_X86_SIG}"
              },
              "windows-x86_64": {
                "url": "${WINDOWS_URL}",
                "signature": "${WINDOWS_SIG}"
              }
            }
          }
          MANIFEST

          echo "--- latest.json ---"
          cat latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: SigVault Desktop ${{ inputs.tag }}
          draft: false
          generate_release_notes: true
          files: all-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
