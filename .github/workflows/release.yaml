name: Release Desktop App

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.7.0)"
        required: true
        type: string
      dry_run:
        description: "Build and package on every platform, upload the artifacts, but don't create a release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The minisign public key of TAURI_SIGNING_PRIVATE_KEY, as published on
  # sigvault.org/download. The release job refuses to publish a checksum list
  # whose signature doesn't verify against it.
  RELEASE_MINISIGN_PUBKEY: RWSmjiWgvXJfi9XwlqVEkwGo9aOCPlxTsbvu9QHoXbBxSrkTO0lJMkNN

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            formats: deb,appimage
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            label: darwin-aarch64
            formats: app,dmg
          - platform: macos-15
            rust_target: x86_64-apple-darwin
            label: darwin-x86_64
            formats: app,dmg
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            label: windows-x86_64
            formats: nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # ENV_VARS_DESKTOP is a bundled KEY=VALUE secret on the `development`
      # GitHub environment of this repo. It is not maintained by hand — the
      # private `sigvault-secrets` repo owns the values
      # (projects/desktop/development.env) and pushes them here from its
      # sync-secrets workflow. `.ee.desktop` in this repo is the schema only.
      #
      # The updater signing key is the only build-time input; everything else
      # the app needs is per-environment and resolved at runtime
      # (`BUILTIN_OAUTH_CLIENTS` in crates/sigvault-core/src/env_config/mod.rs).
      # The key keeps its TAURI_* name: it is the same minisign key the Tauri
      # builds were signed with, so their built-in updater accepts this app.
      - name: Prepare build environment
        uses: n1rna/ee-action/hydrate@v1
        with:
          environment: development
          config_path: .ee.desktop
          env_file: .env
          gh_secret: ${{ secrets.ENV_VARS_DESKTOP }}

      - name: Export env vars for build
        shell: bash
        run: |
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" =~ ^# ]] && continue
            value="${value%\"}"
            value="${value#\"}"
            # GitHub only masks ENV_VARS_DESKTOP as one blob, so a single
            # unbundled value could still reach the log verbatim. Register
            # each one before it goes anywhere near a build tool.
            [[ -n "$value" ]] && echo "::add-mask::${value}"
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done < .env

      - name: Check updater signing key
        shell: bash
        run: |
          # An empty key is what `ee hydrate` writes when the sheet is missing
          # the value. Without it the release has no update signatures and no
          # installed copy (old Tauri builds included) can update to it.
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              echo "::warning::TAURI_SIGNING_PRIVATE_KEY is empty; dry run continues without update signatures."
              exit 0
            fi
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty. Check ENV_VARS_DESKTOP on this repo's 'development' environment; sigvault-secrets (projects/desktop/development.env) is the source of truth."
            exit 1
          fi
          echo "Updater signing key present (${#TAURI_SIGNING_PRIVATE_KEY} chars)."
          echo "CARGO_PACKAGER_SIGN_PRIVATE_KEY<<EOF_KEY" >> "$GITHUB_ENV"
          echo "${TAURI_SIGNING_PRIVATE_KEY}" >> "$GITHUB_ENV"
          echo "EOF_KEY" >> "$GITHUB_ENV"
          echo "CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD=${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" >> "$GITHUB_ENV"

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          echo "Setting version to $VERSION"
          # The only `version = ` line in the root manifest is
          # [workspace.package]; both crates inherit it.
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml && rm Cargo.toml.bak
          grep '^version' Cargo.toml

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libudev-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libvulkan1 \
            libfuse2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.label }}

      - name: Install cargo-packager
        run: cargo install --locked cargo-packager --version 0.11.8

      - name: Build
        run: cargo build --release -p sigvault-app --target ${{ matrix.rust_target }}

      - name: Package
        shell: bash
        env:
          # linuxdeploy ships as an AppImage; runners have no FUSE mount.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          cargo packager -p sigvault-app --release \
            --target ${{ matrix.rust_target }} \
            -f ${{ matrix.formats }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          OUT=target/${{ matrix.rust_target }}/release
          LABEL="${{ matrix.label }}"
          echo "=== Packager output ==="
          ls -la "$OUT" | grep -iE 'sigvault|\.sig$' || true
          shopt -s nullglob
          case "$RUNNER_OS" in
            Linux)
              cp "$OUT"/*.deb "$OUT"/*.AppImage "$OUT"/*.AppImage.sig artifacts/
              ;;
            macOS)
              cp "$OUT"/*.dmg artifacts/
              # Updater archive: arch in the name so both macOS builds can
              # live in one release.
              for f in "$OUT"/*.app.tar.gz "$OUT"/*.app.tar.gz.sig; do
                name=$(basename "$f")
                cp "$f" "artifacts/${name/.app.tar.gz/_${LABEL}.app.tar.gz}"
              done
              ;;
            Windows)
              cp "$OUT"/*-setup.exe "$OUT"/*-setup.exe.sig artifacts/
              ;;
          esac
          echo "=== Collected artifacts ==="
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only for the signing key, to sign SHA256SUMS.txt below. Same source as
      # the build jobs: ENV_VARS_DESKTOP, owned by sigvault-secrets.
      - name: Prepare signing key
        uses: n1rna/ee-action/hydrate@v1
        with:
          environment: development
          config_path: .ee.desktop
          env_file: .env
          gh_secret: ${{ secrets.ENV_VARS_DESKTOP }}

      - name: Export signing key
        shell: bash
        run: |
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" =~ ^# ]] && continue
            value="${value%\"}"
            value="${value#\"}"
            [[ -n "$value" ]] && echo "::add-mask::${value}"
            case "$key" in
              TAURI_SIGNING_PRIVATE_KEY)
                { echo "CARGO_PACKAGER_SIGN_PRIVATE_KEY<<EOF_KEY"; echo "$value"; echo "EOF_KEY"; } >> "$GITHUB_ENV" ;;
              TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
                echo "CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD=${value}" >> "$GITHUB_ENV" ;;
            esac
          done < .env
          rm -f .env

      - name: Install cargo-packager and minisign
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          cargo install --locked cargo-packager --version 0.11.8

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR all-artifacts/

      - name: Generate SHA-256 checksums
        run: |
          cd all-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # cargo-packager writes a Tauri-style .sig (a base64-wrapped minisign
      # signature); decoded it is a plain .minisig that `minisign -V` checks,
      # which is what sigvault.org/download tells users to run.
      - name: Sign SHA256SUMS.txt
        shell: bash
        run: |
          cd all-artifacts
          if [[ -z "${CARGO_PACKAGER_SIGN_PRIVATE_KEY:-}" ]]; then
            echo "::error::No signing key; refusing to publish an unsigned checksum list."
            exit 1
          fi
          cargo packager signer sign SHA256SUMS.txt
          base64 -d < SHA256SUMS.txt.sig > SHA256SUMS.txt.minisig
          rm SHA256SUMS.txt.sig
          minisign -Vm SHA256SUMS.txt -x SHA256SUMS.txt.minisig -P "$RELEASE_MINISIGN_PUBKEY"

      # Same manifest shape as the Tauri builds published, so installed Tauri
      # copies (tauri-plugin-updater) and this app's update banner both read
      # it. Tauri's updater replaces the .app from the .app.tar.gz, swaps the
      # AppImage, and runs the Windows installer.
      - name: Generate updater manifest (latest.json)
        shell: bash
        run: |
          cd all-artifacts
          VERSION="${{ inputs.tag }}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REPO="https://github.com/n1rna/sigvault-desktop/releases/download/${VERSION}"

          find_file() { ls $1 2>/dev/null | grep -v '\.sig$' | head -1 || true; }
          platform() {
            local file sig
            file=$(find_file "$2")
            if [[ -z "$file" || ! -s "${file}.sig" ]]; then
              echo "::warning::No signed updater artifact for $1" >&2
              return
            fi
            sig=$(cat "${file}.sig")
            printf '    "%s": { "url": "%s/%s", "signature": "%s" }' "$1" "$REPO" "$file" "$sig"
          }

          entries=()
          for spec in \
            "linux-x86_64|*.AppImage" \
            "darwin-aarch64|*darwin-aarch64.app.tar.gz" \
            "darwin-x86_64|*darwin-x86_64.app.tar.gz" \
            "windows-x86_64|*-setup.exe"; do
            e=$(platform "${spec%%|*}" "${spec#*|}")
            [[ -n "$e" ]] && entries+=("$e")
          done

          {
            echo "{"
            echo "  \"version\": \"${VERSION}\","
            echo "  \"pub_date\": \"${PUB_DATE}\","
            echo "  \"platforms\": {"
            ( IFS=$'\n'; printf '%s' "${entries[*]}" | sed '$!s/$/,/' )
            echo ""
            echo "  }"
            echo "}"
          } > latest.json

          echo "--- latest.json ---"
          cat latest.json
          python3 -m json.tool latest.json > /dev/null

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: SigVault Desktop ${{ inputs.tag }}
          draft: false
          generate_release_notes: true
          files: all-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The second source on sigvault.org/download: every file goes to the
      # sigvault-downloads R2 bucket (served by the landing site's Pages
      # Function), with a manifest the download page reads. Same layout as
      # n1rna/sigvault's scripts/mirror-desktop-release.sh.
      - name: Mirror to sigvault.org
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::warning::CLOUDFLARE_R2_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; the release is on GitHub only. Mirror it later with scripts/mirror-desktop-release.sh $TAG in n1rna/sigvault."
            exit 0
          fi
          cd all-artifacts
          BUCKET=sigvault-downloads
          content_type() {
            case "$1" in
              *.json) echo "application/json" ;;
              *.txt|*.minisig|*.sig) echo "text/plain; charset=utf-8" ;;
              *.dmg) echo "application/x-apple-diskimage" ;;
              *.exe) echo "application/vnd.microsoft.portable-executable" ;;
              *.deb) echo "application/vnd.debian.binary-package" ;;
              *) echo "application/octet-stream" ;;
            esac
          }
          files="[]"
          for f in *; do
            [[ -f "$f" ]] || continue
            # The updater manifest points at GitHub; the mirror has its own.
            [[ "$f" == "latest.json" ]] && continue
            npx --yes wrangler@3 r2 object put "$BUCKET/desktop/$TAG/$f" \
              --file "$f" --content-type "$(content_type "$f")" --remote > /dev/null
            echo "put desktop/$TAG/$f"
            files=$(jq -c --arg n "$f" --argjson s "$(stat -c %s "$f")" \
              --arg h "$(sha256sum "$f" | cut -d' ' -f1)" '. + [{name: $n, size: $s, sha256: $h}]' <<< "$files")
          done
          jq -n --arg v "${TAG#v}" --arg t "$TAG" --arg p "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson f "$files" '{version: $v, tag: $t, published_at: $p, files: $f}' > ../manifest.json
          npx --yes wrangler@3 r2 object put "$BUCKET/desktop/$TAG/manifest.json" \
            --file ../manifest.json --content-type application/json --remote > /dev/null
          npx --yes wrangler@3 r2 object put "$BUCKET/desktop/latest.json" \
            --file ../manifest.json --content-type application/json --remote > /dev/null
          echo "desktop/latest.json now points at $TAG"

          # Read it back through the public URL, so a broken binding or route
          # shows up here rather than on the download page.
          sleep 5
          curl -fsS "https://sigvault.org/download/desktop/$TAG/SHA256SUMS.txt" | diff - SHA256SUMS.txt
          echo "Mirror verified: https://sigvault.org/download/desktop/$TAG/"
