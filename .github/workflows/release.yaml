name: Release Desktop App

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            label: darwin-aarch64
          - platform: macos-15
            rust_target: x86_64-apple-darwin
            label: darwin-x86_64
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            label: windows-x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build environment
        uses: n1rna/ee-action@main
        with:
          environment: development
          config_path: .ee.desktop
          env_file: .env
          gh_secret: ${{ secrets.ENV_VARS_DESKTOP }}

      - name: Set version from tag (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          echo "Setting version to $VERSION"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i '' "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
            sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
            sed -i '' "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          else
            sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
            sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          fi
          grep '"version"' src-tauri/tauri.conf.json
          grep '^version' src-tauri/Cargo.toml
          head -5 package.json

      - name: Set version from tag (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ inputs.tag }}".TrimStart("v")
          Write-Host "Setting version to $version"
          (Get-Content src-tauri/tauri.conf.json) -replace '"version": ".*?"', "`"version`": `"$version`"" | Set-Content src-tauri/tauri.conf.json
          (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*?"', "version = `"$version`"" | Set-Content src-tauri/Cargo.toml
          (Get-Content package.json) -replace '"version": ".*?"', "`"version`": `"$version`"" | Set-Content package.json
          Select-String '"version"' src-tauri/tauri.conf.json
          Select-String '^version' src-tauri/Cargo.toml

      - name: Export env vars for build
        shell: bash
        run: |
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" =~ ^# ]] && continue
            value="${value%\"}"
            value="${value#\"}"
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done < .env

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libudev-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.label }}

      - name: Install frontend dependencies
        run: bun install

      - name: Clean old bundle artifacts
        shell: bash
        run: rm -rf src-tauri/target/${{ matrix.rust_target }}/release/bundle

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.rust_target }}

      - name: Collect artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          BUNDLE=src-tauri/target/${{ matrix.rust_target }}/release/bundle
          cp $BUNDLE/deb/*.deb artifacts/ 2>/dev/null || true
          cp $BUNDLE/rpm/*.rpm artifacts/ 2>/dev/null || true
          cp $BUNDLE/appimage/*.AppImage artifacts/ 2>/dev/null || true
          cp $BUNDLE/appimage/*.AppImage.tar.gz artifacts/ 2>/dev/null || true
          cp $BUNDLE/appimage/*.AppImage.tar.gz.sig artifacts/ 2>/dev/null || true

      - name: Collect artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          BUNDLE=src-tauri/target/${{ matrix.rust_target }}/release/bundle
          cp $BUNDLE/dmg/*.dmg artifacts/ 2>/dev/null || true
          cp $BUNDLE/macos/*.app.tar.gz artifacts/ 2>/dev/null || true
          cp $BUNDLE/macos/*.app.tar.gz.sig artifacts/ 2>/dev/null || true

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          $bundle = "src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          Copy-Item "$bundle/nsis/*.exe" artifacts/ -ErrorAction SilentlyContinue
          Copy-Item "$bundle/nsis/*.nsis.zip" artifacts/ -ErrorAction SilentlyContinue
          Copy-Item "$bundle/nsis/*.nsis.zip.sig" artifacts/ -ErrorAction SilentlyContinue

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR all-artifacts/

      - name: Generate SHA-256 checksums
        run: |
          cd all-artifacts
          sha256sum * > SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Generate updater manifest (latest.json)
        shell: bash
        run: |
          cd all-artifacts
          VERSION="${{ inputs.tag }}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REPO="https://github.com/n1rna/sigvault-desktop/releases/download/${VERSION}"

          read_sig() { cat "$1" 2>/dev/null || echo ""; }

          LINUX_SIG=$(read_sig *AppImage.tar.gz.sig)
          DARWIN_AARCH64_SIG=$(read_sig *aarch64.app.tar.gz.sig)
          DARWIN_X86_SIG=$(read_sig *x64.app.tar.gz.sig)
          WINDOWS_SIG=$(read_sig *nsis.zip.sig)

          LINUX_URL="${REPO}/$(ls *AppImage.tar.gz 2>/dev/null | grep -v '\.sig$' | head -1)"
          DARWIN_AARCH64_URL="${REPO}/$(ls *aarch64.app.tar.gz 2>/dev/null | grep -v '\.sig$' | head -1)"
          DARWIN_X86_URL="${REPO}/$(ls *x64.app.tar.gz 2>/dev/null | grep -v '\.sig$' | head -1)"
          WINDOWS_URL="${REPO}/$(ls *nsis.zip 2>/dev/null | grep -v '\.sig$' | head -1)"

          cat > latest.json << MANIFEST
          {
            "version": "${VERSION}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "linux-x86_64": {
                "url": "${LINUX_URL}",
                "signature": "${LINUX_SIG}"
              },
              "darwin-aarch64": {
                "url": "${DARWIN_AARCH64_URL}",
                "signature": "${DARWIN_AARCH64_SIG}"
              },
              "darwin-x86_64": {
                "url": "${DARWIN_X86_URL}",
                "signature": "${DARWIN_X86_SIG}"
              },
              "windows-x86_64": {
                "url": "${WINDOWS_URL}",
                "signature": "${WINDOWS_SIG}"
              }
            }
          }
          MANIFEST

          echo "--- latest.json ---"
          cat latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: SigVault Desktop ${{ inputs.tag }}
          draft: false
          generate_release_notes: true
          files: all-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
