name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Also run the #[ignore]'d regtest e2e tests (needs a regtest stack — currently a TODO; see job comments)"
        type: boolean
        default: false

# Cancel in-flight runs on the same branch when a new commit lands.
# Keeps CI minutes down on busy PRs without losing main-branch results.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # `-D warnings` and clippy `all = deny` live in the workspace `[lints]`
  # block in Cargo.toml — authoritative for both CI and local runs.

jobs:
  rust:
    name: Rust — fmt, clippy, test, audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system deps (GPUI + hardware wallets)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libudev-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libvulkan1

      - name: Setup Rust (stable, with rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # Bump on bigger refactors to invalidate stale incrementals.
          shared-key: desktop-gpui-v1

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        # `--all-targets` covers tests too. Warnings are errors via the
        # workspace `[lints]` table.
        run: cargo clippy --workspace --all-targets --no-deps

      - name: cargo test
        # Default runner skips `#[ignore]`'d cases: covers the core unit
        # tests, the app's router / key-library / wallet-pipeline tests and
        # the non-network cases in `crates/sigvault-core/tests/regtest_e2e.rs`.
        run: cargo test --workspace

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: cargo audit (supply chain)
        # Informational only: cargo-audit also exits non-zero on yanked
        # crates, and yanked != vulnerability. Real CVEs still show up in the
        # run output for reviewers.
        continue-on-error: true
        run: cargo audit

  # GPUI has a separate platform layer per OS (Metal / DirectX / Vulkan), so
  # make sure the app still compiles on the other two desktop targets.
  build:
    name: Build — ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macos
          - platform: windows-latest
            label: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-gpui-v1-${{ matrix.label }}

      - name: cargo build
        run: cargo build --workspace --all-targets

  # ────────────────────────────────────────────────────────────────
  # Optional: full regtest e2e against bitcoind + electrs.
  #
  # The #[ignore]'d tests in `crates/sigvault-core/tests/regtest_e2e.rs`
  # need a live bitcoind RPC + electrs. Until a docker-compose orchestration
  # is wired into this job, run them locally before tagging:
  #
  #   cargo test -p sigvault-core --test regtest_e2e -- --ignored --nocapture
  #
  # See `docs/qa/standalone-wallet-v1.md` for the full manual matrix.
  # ────────────────────────────────────────────────────────────────
  e2e_regtest:
    name: E2E (regtest) — placeholder
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    runs-on: ubuntu-latest
    steps:
      - name: TODO — wire bitcoind + electrs services
        run: |
          echo "Not yet implemented. Run locally:" >&2
          echo "  cargo test -p sigvault-core --test regtest_e2e -- --ignored --nocapture" >&2
          exit 1
