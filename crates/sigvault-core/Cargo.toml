[package]
name = "sigvault-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SigVault Desktop core: local wallets, hardware signers, cloud sessions"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23.1", features = ["rustls-tls-native-roots"] }
tungstenite = "0.23.0"
reqwest = { version = "0.12.5", default-features = false, features = ["rustls-tls", "json"] }
futures-util = "0.3.30"
futures = "0.3.30"
log = "0.4"
machine-uid = "0.5.2"
uuid = { version = "1.10.0", features = ["v4"] }
thiserror = "1.0.63"
oauth2 = "4.4"
axum = { version = "0.7", features = ["tokio"] }
tower = "0.5"
open = "5.0"
dirs = "5"
async-hwi = { git = "https://github.com/n1rna/async-hwi.git", branch = "master", features = ["trezor", "bitbox"] }
bitcoin = "0.32.8"
async-trait = "0.1.89"
once_cell = "1.21.3"
hex = "0.4"
rand = "0.10.0"
argon2 = "0.5"
sha2 = "0.10"
chacha20poly1305 = "0.10"
getrandom = "0.2"
base64 = "0.22"
zeroize = "1.8"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
policy-core = { git = "https://github.com/n1rna/walletrs.git", branch = "main" }
wallet-runtime = { git = "https://github.com/n1rna/walletrs.git", branch = "main" }
bdk_wallet = { version = "1.1.0", features = ["file_store", "bip39", "keys-bip39"] }
bdk_file_store = "0.18.1"
libusb1-sys = { version = "0.7", features = ["vendored"] }

[dev-dependencies]
env_logger = "0.11"
electrum-client = "0.21"
tempfile = "3"

[lints]
workspace = true
