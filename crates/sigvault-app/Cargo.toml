[package]
name = "sigvault-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SigVault Desktop — GPUI front end"

[[bin]]
name = "sigvault-desktop"
path = "src/main.rs"

[dependencies]
sigvault-core = { path = "../sigvault-core" }
gpui = "0.2.2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
rust-embed = "8"
unicode-segmentation = "1"
qrcode = { version = "0.14", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12.5", default-features = false, features = ["rustls-tls", "json"] }
semver = "1"
base64 = "0.22"
bip39 = "2"
ur = "0.5"
bbqr = { version = "0.6", default-features = false }
rqrr = { version = "0.11", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
